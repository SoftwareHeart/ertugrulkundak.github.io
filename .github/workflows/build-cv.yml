name: CV PDF'lerini güncelle

# index.html içindeki CV bölümü (veya baskı stili / çeviri sözlüğü) değişince
# ErtugrulKundak_CV.pdf ve ErtugrulKundak_CV_EN.pdf otomatik yeniden üretilir.
on:
  push:
    branches: [main]
    paths:
      - index.html
      - style.css
      - cv-print.css
      - i18n.js
      - scripts/build-cv.mjs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: PDF'leri üret
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/build-cv.mjs

      - name: Değişiklik varsa commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ErtugrulKundak_CV.pdf ErtugrulKundak_CV_EN.pdf
          if git diff --cached --quiet; then
            echo "PDF değişmedi."
          else
            git commit -m "CV PDF'leri otomatik güncellendi"
            git push
          fi
